name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # The image is an index (amd64 + arm64), and ghcr reads the package
          # description from the index annotations, not from the per-platform
          # image config.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=Junos configuration backup into git with a Prometheus exporter

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sizes are recorded per release so a jump is visible in the run log.
      # Everything here is the compressed (registry) size: a pulled image
      # unpacks to more, and the two never match.
      - name: Image size
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          repo="${IMAGE%@*}"
          {
            echo "### Image size"
            echo
            echo "| Platform | Compressed | Layers |"
            echo "| --- | --- | --- |"
            docker buildx imagetools inspect "$IMAGE" --raw \
              | jq -r '.manifests[]
                       | select(.platform.architecture != "unknown")
                       | "\(.platform.os)/\(.platform.architecture) \(.digest)"' \
              | while read -r platform digest; do
                  docker buildx imagetools inspect "$repo@$digest" --raw \
                    | jq -r --arg p "$platform" \
                        '"| \($p) | \((([.layers[].size] + [.config.size] | add) / 1048576 * 100 | round) / 100) MB | \(.layers | length) |"'
                done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: log in to the OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} --password-stdin

      # Chart and app share the tag, minus the leading v.
      - name: package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/jconfig -d dist \
            --version "$version" --app-version "$version"
          helm push "dist/jconfig-$version.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
