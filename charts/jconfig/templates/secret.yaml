{{- if and .Values.secret.create (not .Values.existingSecret) }}
{{- /*
Private keys are base64-encoded on the way in. jconfig accepts either PEM or
base64 for an inline key, and base64 is what survives ${VAR} substitution: a
raw PEM's newlines would break the YAML document it is substituted into.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jconfig.fullname" . }}
  labels:
    {{- include "jconfig.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- with .Values.sshPrivateKey }}
  JCONFIG_SSH_KEY: {{ b64enc . | quote }}
  {{- end }}
  {{- with .Values.gitPrivateKey }}
  JCONFIG_GIT_SSH_KEY: {{ b64enc . | quote }}
  {{- end }}
{{- end }}
